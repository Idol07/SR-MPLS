# =============================================================================
# Nokia SR Linux Startup Configuration: as (Tier 4 Access Switch - MAC-VRF)
# Platform: 7220 IXR-D2L (License-Free) | Bowtie Uplinks: e1-1 (ce-a), e1-2 (ce-a1)
# Access Ports: e1-3 (host-as Corp), e1-4 (host-as1 Backup), e1-5 (host-as Overlap)
# =============================================================================

set / interface ethernet-1/1 description "Bowtie-Uplink-1-to-ce-a" admin-state enable vlan-tagging true
set / interface ethernet-1/1 subinterface 10 type bridged admin-state enable vlan encap single-tagged vlan-id 10
set / interface ethernet-1/1 subinterface 100 type bridged admin-state enable vlan encap single-tagged vlan-id 100

set / interface ethernet-1/2 description "Bowtie-Uplink-2-to-ce-a1" admin-state enable vlan-tagging true
set / interface ethernet-1/2 subinterface 10 type bridged admin-state enable vlan encap single-tagged vlan-id 10
set / interface ethernet-1/2 subinterface 100 type bridged admin-state enable vlan encap single-tagged vlan-id 100

set / interface ethernet-1/3 description "Access-VLAN10-Primary-to-host-as" admin-state enable vlan-tagging true
set / interface ethernet-1/3 subinterface 10 type bridged admin-state enable vlan encap untagged

set / interface ethernet-1/4 description "Access-VLAN10-Backup-to-host-as1" admin-state enable vlan-tagging true
set / interface ethernet-1/4 subinterface 10 type bridged admin-state enable vlan encap untagged

set / interface ethernet-1/5 description "Access-VLAN100-Overlap-to-host-as" admin-state enable vlan-tagging true
set / interface ethernet-1/5 subinterface 100 type bridged admin-state enable vlan encap untagged

set / network-instance vlan-10 type mac-vrf admin-state enable
set / network-instance vlan-10 interface ethernet-1/1.10
set / network-instance vlan-10 interface ethernet-1/2.10
set / network-instance vlan-10 interface ethernet-1/3.10
set / network-instance vlan-10 interface ethernet-1/4.10

set / network-instance vlan-100 type mac-vrf admin-state enable
set / network-instance vlan-100 interface ethernet-1/1.100
set / network-instance vlan-100 interface ethernet-1/2.100
set / network-instance vlan-100 interface ethernet-1/5.100