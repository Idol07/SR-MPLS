# =============================================================================
# Nokia SR Linux Startup Configuration: pe-b1 (Tier 2 Provider Edge Router)
# Platform: 7250 IXR-6e | Loopback: 10.0.0.4/32 | SR Node-SID: 16004 (Index 4)
# 2 Core Uplinks: e1-1 (core1), e1-2 (core2)
# 4 CE Links (4x4 Mesh): e1-3 (ce-a), e1-4 (ce-a1), e1-5 (ce-b), e1-6 (ce-b1)
# =============================================================================

set / system mpls label-ranges static srgb-static shared true start-label 16000 end-label 23999
set / system mpls label-ranges dynamic srlb-dyn start-label 24000 end-label 24999
set / system mpls label-ranges dynamic vpn-dyn start-label 25000 end-label 29999
set / system mpls services network-instance dynamic-label-block vpn-dyn

set / interface system0 admin-state enable
set / interface system0 subinterface 0 admin-state enable ipv4 admin-state enable address 10.0.0.4/32

set / interface ethernet-1/1 description "Core-Uplink-to-core1" admin-state enable
set / interface ethernet-1/1 subinterface 0 admin-state enable ipv4 admin-state enable address 10.0.4.1/30
set / interface ethernet-1/2 description "Core-Uplink-to-core2" admin-state enable
set / interface ethernet-1/2 subinterface 0 admin-state enable ipv4 admin-state enable address 10.0.8.1/30

set / interface ethernet-1/3 description "VRF-A-Link-to-ce-a" admin-state enable
set / interface ethernet-1/3 subinterface 0 admin-state enable ipv4 admin-state enable address 10.101.7.1/30
set / interface ethernet-1/4 description "VRF-A-Link-to-ce-a1" admin-state enable
set / interface ethernet-1/4 subinterface 0 admin-state enable ipv4 admin-state enable address 10.101.8.1/30

set / interface ethernet-1/5 description "VRF-B-Link-to-ce-b" admin-state enable
set / interface ethernet-1/5 subinterface 0 admin-state enable ipv4 admin-state enable address 10.102.7.1/30
set / interface ethernet-1/6 description "VRF-B-Link-to-ce-b1" admin-state enable
set / interface ethernet-1/6 subinterface 0 admin-state enable ipv4 admin-state enable address 10.102.8.1/30

set / bfd subinterface system0.0 admin-state enable desired-minimum-transmit-interval 100000 required-minimum-receive 100000 detection-multiplier 3
set / bfd subinterface ethernet-1/1.0 admin-state enable desired-minimum-transmit-interval 100000 required-minimum-receive 100000 detection-multiplier 3
set / bfd subinterface ethernet-1/2.0 admin-state enable desired-minimum-transmit-interval 100000 required-minimum-receive 100000 detection-multiplier 3
set / bfd subinterface ethernet-1/3.0 admin-state enable desired-minimum-transmit-interval 100000 required-minimum-receive 100000 detection-multiplier 3
set / bfd subinterface ethernet-1/4.0 admin-state enable desired-minimum-transmit-interval 100000 required-minimum-receive 100000 detection-multiplier 3
set / bfd subinterface ethernet-1/5.0 admin-state enable desired-minimum-transmit-interval 100000 required-minimum-receive 100000 detection-multiplier 3
set / bfd subinterface ethernet-1/6.0 admin-state enable desired-minimum-transmit-interval 100000 required-minimum-receive 100000 detection-multiplier 3

# Routing Policies: Primary Stack Preference (LP 200) vs Cross-Mesh Backup (LP 100) + Overlap Isolation
set / routing-policy prefix-set PL_OVERLAP_DENY prefix 192.168.0.0/16 mask-length-range 16..32
set / routing-policy policy RM_EXTRANET_IMPORT statement 10 match prefix prefix-set PL_OVERLAP_DENY
set / routing-policy policy RM_EXTRANET_IMPORT statement 10 action policy-result reject
set / routing-policy policy RM_EXTRANET_IMPORT default-action policy-result accept
set / routing-policy policy RM_PRIMARY_LP200 default-action policy-result accept bgp local-preference set 200
set / routing-policy policy RM_BACKUP_LP100 default-action policy-result accept bgp local-preference set 100
set / routing-policy policy ACCEPT_ALL default-action policy-result accept

# Default Network-Instance: MPLS, SR-ISIS & MP-BGP VPN Mesh
set / network-instance default type default admin-state enable
set / network-instance default interface system0.0
set / network-instance default interface ethernet-1/1.0
set / network-instance default interface ethernet-1/2.0
set / network-instance default mpls admin-state enable
set / network-instance default mpls interface ethernet-1/1.0 admin-state enable
set / network-instance default mpls interface ethernet-1/2.0 admin-state enable
set / network-instance default segment-routing mpls global-block label-range srgb-static

set / network-instance default protocols isis instance CORE admin-state enable
set / network-instance default protocols isis instance CORE level-capability L2
set / network-instance default protocols isis instance CORE max-ecmp-paths 4
set / network-instance default protocols isis instance CORE net [ 49.0001.0000.0000.0004.00 ]
set / network-instance default protocols isis instance CORE ipv4-unicast admin-state enable
set / network-instance default protocols isis instance CORE segment-routing mpls admin-state enable
set / network-instance default protocols isis instance CORE segment-routing mpls dynamic-label-block srlb-dyn
set / network-instance default protocols isis instance CORE interface system0.0 admin-state enable passive true
set / network-instance default protocols isis instance CORE interface system0.0 segment-routing mpls ipv4-node-sid index 4
set / network-instance default protocols isis instance CORE interface ethernet-1/1.0 admin-state enable circuit-type point-to-point ipv4-unicast admin-state enable include-bfd-tlv true
set / network-instance default protocols isis instance CORE interface ethernet-1/1.0 level 2 metric 10
set / network-instance default protocols isis instance CORE interface ethernet-1/2.0 admin-state enable circuit-type point-to-point ipv4-unicast admin-state enable include-bfd-tlv true
set / network-instance default protocols isis instance CORE interface ethernet-1/2.0 level 2 metric 10

set / network-instance default protocols bgp admin-state enable
set / network-instance default protocols bgp autonomous-system 65000
set / network-instance default protocols bgp router-id 10.0.0.4
set / network-instance default protocols bgp afi-safi ipv4-unicast admin-state false
set / network-instance default protocols bgp afi-safi evpn admin-state enable
set / network-instance default protocols bgp group PE-MESH admin-state enable peer-as 65000
set / network-instance default protocols bgp group PE-MESH local-address 10.0.0.4
set / network-instance default protocols bgp group PE-MESH afi-safi evpn admin-state enable
set / network-instance default protocols bgp group PE-MESH failure-detection enable-bfd true fast-failover true
set / network-instance default protocols bgp group PE-MESH export-policy [ ACCEPT_ALL ]
set / network-instance default protocols bgp group PE-MESH import-policy [ ACCEPT_ALL ]
set / network-instance default protocols bgp neighbor 10.0.0.1 peer-group PE-MESH
set / network-instance default protocols bgp neighbor 10.0.0.2 peer-group PE-MESH
set / network-instance default protocols bgp neighbor 10.0.0.3 peer-group PE-MESH

# Customer A IP-VRF (vrf-a: RD 10.0.0.4:101, Export RT 65000:101, Extranet Import RT 65000:102)
set / network-instance vrf-a type ip-vrf admin-state enable
set / network-instance vrf-a interface ethernet-1/3.0
set / network-instance vrf-a interface ethernet-1/4.0
set / network-instance vrf-a protocols bgp-vpn bgp-instance 1 route-distinguisher rd 10.0.0.4:101
set / network-instance vrf-a protocols bgp-vpn bgp-instance 1 route-target export-rt target:65000:100
set / network-instance vrf-a protocols bgp-vpn bgp-instance 1 route-target import-rt target:65000:100
set / network-instance vrf-a protocols bgp-vpn bgp-instance 1 import-policy [ RM_EXTRANET_IMPORT ]
set / network-instance vrf-a protocols bgp-evpn bgp-instance 1 admin-state enable encapsulation-type mpls evi 101 ecmp 4
set / network-instance vrf-a protocols bgp-evpn bgp-instance 1 mpls next-hop-resolution allowed-tunnel-types [ sr-isis ]
set / network-instance vrf-a protocols bgp admin-state enable autonomous-system 65000 router-id 10.101.7.1
set / network-instance vrf-a protocols bgp ebgp-default-policy import-reject-all false export-reject-all false
set / network-instance vrf-a protocols bgp afi-safi ipv4-unicast admin-state enable
set / network-instance vrf-a protocols bgp afi-safi ipv4-unicast multipath allow-multiple-as true max-paths-level-1 4 max-paths-level-2 4
set / network-instance vrf-a protocols bgp group CE-A-PEERS admin-state enable peer-as 65101
set / network-instance vrf-a protocols bgp group CE-A-PEERS afi-safi ipv4-unicast admin-state enable
set / network-instance vrf-a protocols bgp group CE-A-PEERS import-policy [ RM_BACKUP_LP100 ]
set / network-instance vrf-a protocols bgp group CE-A-PEERS failure-detection enable-bfd true fast-failover true
set / network-instance vrf-a protocols bgp neighbor 10.101.7.2 peer-group CE-A-PEERS
set / network-instance vrf-a protocols bgp neighbor 10.101.8.2 peer-group CE-A-PEERS

# Customer B IP-VRF (vrf-b: RD 10.0.0.4:102, Export RT 65000:102, Extranet Import RT 65000:101)
set / network-instance vrf-b type ip-vrf admin-state enable
set / network-instance vrf-b interface ethernet-1/5.0
set / network-instance vrf-b interface ethernet-1/6.0
set / network-instance vrf-b protocols bgp-vpn bgp-instance 1 route-distinguisher rd 10.0.0.4:102
set / network-instance vrf-b protocols bgp-vpn bgp-instance 1 route-target export-rt target:65000:100
set / network-instance vrf-b protocols bgp-vpn bgp-instance 1 route-target import-rt target:65000:100
set / network-instance vrf-b protocols bgp-vpn bgp-instance 1 import-policy [ RM_EXTRANET_IMPORT ]
set / network-instance vrf-b protocols bgp-evpn bgp-instance 1 admin-state enable encapsulation-type mpls evi 102 ecmp 4
set / network-instance vrf-b protocols bgp-evpn bgp-instance 1 mpls next-hop-resolution allowed-tunnel-types [ sr-isis ]
set / network-instance vrf-b protocols bgp admin-state enable autonomous-system 65000 router-id 10.102.7.1
set / network-instance vrf-b protocols bgp ebgp-default-policy import-reject-all false export-reject-all false
set / network-instance vrf-b protocols bgp afi-safi ipv4-unicast admin-state enable
set / network-instance vrf-b protocols bgp afi-safi ipv4-unicast multipath allow-multiple-as true max-paths-level-1 4 max-paths-level-2 4
set / network-instance vrf-b protocols bgp group CE-B-PEERS admin-state enable peer-as 65102
set / network-instance vrf-b protocols bgp group CE-B-PEERS afi-safi ipv4-unicast admin-state enable
set / network-instance vrf-b protocols bgp group CE-B-PEERS import-policy [ RM_PRIMARY_LP200 ]
set / network-instance vrf-b protocols bgp group CE-B-PEERS failure-detection enable-bfd true fast-failover true
set / network-instance vrf-b protocols bgp neighbor 10.102.7.2 peer-group CE-B-PEERS
set / network-instance vrf-b protocols bgp neighbor 10.102.8.2 peer-group CE-B-PEERS