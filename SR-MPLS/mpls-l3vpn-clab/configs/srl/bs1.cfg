# =============================================================================
# Nokia SR Linux Startup Configuration: bs1 (Tier 4 Access Switch - MAC-VRF)
# Platform: 7220 IXR-D2L (License-Free) | Bowtie Uplinks: e1-1 (ce-b), e1-2 (ce-b1)
# Access Ports: e1-3 (host-bs1 Corp), e1-4 (host-bs Backup), e1-5 (host-bs1 Overlap)
# =============================================================================

set / interface ethernet-1/1 description "Bowtie-Uplink-1-to-ce-b" admin-state enable vlan-tagging true
set / interface ethernet-1/1 subinterface 21 type bridged admin-state enable vlan encap single-tagged vlan-id 21
set / interface ethernet-1/1 subinterface 101 type bridged admin-state enable vlan encap single-tagged vlan-id 101

set / interface ethernet-1/2 description "Bowtie-Uplink-2-to-ce-b1" admin-state enable vlan-tagging true
set / interface ethernet-1/2 subinterface 21 type bridged admin-state enable vlan encap single-tagged vlan-id 21
set / interface ethernet-1/2 subinterface 101 type bridged admin-state enable vlan encap single-tagged vlan-id 101

set / interface ethernet-1/3 description "Access-VLAN21-Primary-to-host-bs1" admin-state enable vlan-tagging true
set / interface ethernet-1/3 subinterface 21 type bridged admin-state enable vlan encap untagged

set / interface ethernet-1/4 description "Access-VLAN21-Backup-to-host-bs" admin-state enable vlan-tagging true
set / interface ethernet-1/4 subinterface 21 type bridged admin-state enable vlan encap untagged

set / interface ethernet-1/5 description "Access-VLAN101-Overlap-to-host-bs1" admin-state enable vlan-tagging true
set / interface ethernet-1/5 subinterface 101 type bridged admin-state enable vlan encap untagged

set / network-instance vlan-21 type mac-vrf admin-state enable
set / network-instance vlan-21 interface ethernet-1/1.21
set / network-instance vlan-21 interface ethernet-1/2.21
set / network-instance vlan-21 interface ethernet-1/3.21
set / network-instance vlan-21 interface ethernet-1/4.21

set / network-instance vlan-101 type mac-vrf admin-state enable
set / network-instance vlan-101 interface ethernet-1/1.101
set / network-instance vlan-101 interface ethernet-1/2.101
set / network-instance vlan-101 interface ethernet-1/5.101