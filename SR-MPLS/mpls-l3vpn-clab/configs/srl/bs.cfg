# =============================================================================
# Nokia SR Linux Startup Configuration: bs (Tier 4 Access Switch - MAC-VRF)
# Platform: 7220 IXR-D2L (License-Free) | Bowtie Uplinks: e1-1 (ce-b), e1-2 (ce-b1)
# Access Ports: e1-3 (host-bs Corp), e1-4 (host-bs1 Backup), e1-5 (host-bs Overlap)
# =============================================================================

set / interface ethernet-1/1 description "Bowtie-Uplink-1-to-ce-b" admin-state enable vlan-tagging true
set / interface ethernet-1/1 subinterface 20 type bridged admin-state enable vlan encap single-tagged vlan-id 20
set / interface ethernet-1/1 subinterface 100 type bridged admin-state enable vlan encap single-tagged vlan-id 100

set / interface ethernet-1/2 description "Bowtie-Uplink-2-to-ce-b1" admin-state enable vlan-tagging true
set / interface ethernet-1/2 subinterface 20 type bridged admin-state enable vlan encap single-tagged vlan-id 20
set / interface ethernet-1/2 subinterface 100 type bridged admin-state enable vlan encap single-tagged vlan-id 100

set / interface ethernet-1/3 description "Access-VLAN20-Primary-to-host-bs" admin-state enable vlan-tagging true
set / interface ethernet-1/3 subinterface 20 type bridged admin-state enable vlan encap untagged

set / interface ethernet-1/4 description "Access-VLAN20-Backup-to-host-bs1" admin-state enable vlan-tagging true
set / interface ethernet-1/4 subinterface 20 type bridged admin-state enable vlan encap untagged

set / interface ethernet-1/5 description "Access-VLAN100-Overlap-to-host-bs" admin-state enable vlan-tagging true
set / interface ethernet-1/5 subinterface 100 type bridged admin-state enable vlan encap untagged

set / network-instance vlan-20 type mac-vrf admin-state enable
set / network-instance vlan-20 interface ethernet-1/1.20
set / network-instance vlan-20 interface ethernet-1/2.20
set / network-instance vlan-20 interface ethernet-1/3.20
set / network-instance vlan-20 interface ethernet-1/4.20

set / network-instance vlan-100 type mac-vrf admin-state enable
set / network-instance vlan-100 interface ethernet-1/1.100
set / network-instance vlan-100 interface ethernet-1/2.100
set / network-instance vlan-100 interface ethernet-1/5.100