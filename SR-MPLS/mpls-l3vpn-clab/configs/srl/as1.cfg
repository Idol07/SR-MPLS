# =============================================================================
# Nokia SR Linux Startup Configuration: as1 (Tier 4 Access Switch - MAC-VRF)
# Platform: 7220 IXR-D2L (License-Free) | Bowtie Uplinks: e1-1 (ce-a), e1-2 (ce-a1)
# Access Ports: e1-3 (host-as1 Corp), e1-4 (host-as Backup), e1-5 (host-as1 Overlap)
# =============================================================================

set / interface ethernet-1/1 description "Bowtie-Uplink-1-to-ce-a" admin-state enable vlan-tagging true
set / interface ethernet-1/1 subinterface 11 type bridged admin-state enable vlan encap single-tagged vlan-id 11
set / interface ethernet-1/1 subinterface 101 type bridged admin-state enable vlan encap single-tagged vlan-id 101

set / interface ethernet-1/2 description "Bowtie-Uplink-2-to-ce-a1" admin-state enable vlan-tagging true
set / interface ethernet-1/2 subinterface 11 type bridged admin-state enable vlan encap single-tagged vlan-id 11
set / interface ethernet-1/2 subinterface 101 type bridged admin-state enable vlan encap single-tagged vlan-id 101

set / interface ethernet-1/3 description "Access-VLAN11-Primary-to-host-as1" admin-state enable vlan-tagging true
set / interface ethernet-1/3 subinterface 11 type bridged admin-state enable vlan encap untagged

set / interface ethernet-1/4 description "Access-VLAN11-Backup-to-host-as" admin-state enable vlan-tagging true
set / interface ethernet-1/4 subinterface 11 type bridged admin-state enable vlan encap untagged

set / interface ethernet-1/5 description "Access-VLAN101-Overlap-to-host-as1" admin-state enable vlan-tagging true
set / interface ethernet-1/5 subinterface 101 type bridged admin-state enable vlan encap untagged

set / network-instance vlan-11 type mac-vrf admin-state enable
set / network-instance vlan-11 interface ethernet-1/1.11
set / network-instance vlan-11 interface ethernet-1/2.11
set / network-instance vlan-11 interface ethernet-1/3.11
set / network-instance vlan-11 interface ethernet-1/4.11

set / network-instance vlan-101 type mac-vrf admin-state enable
set / network-instance vlan-101 interface ethernet-1/1.101
set / network-instance vlan-101 interface ethernet-1/2.101
set / network-instance vlan-101 interface ethernet-1/5.101