# =============================================================================
# Nokia SR Linux Startup Configuration: ce-a1 (Tier 3 Customer Edge Router)
# Platform: 7220 IXR-D2L (License-Free) | AS 65101 | Loopback: 172.16.255.2/32
# 4 WAN Uplinks: e1-1 (pe-a), e1-2 (pe-a1), e1-3 (pe-b), e1-4 (pe-b1)
# 2 LAN Bowtie Trunks: e1-5 (as), e1-6 (as1) with Native VRRPv3
# =============================================================================

set / interface system0 admin-state enable
set / interface system0 subinterface 0 admin-state enable ipv4 admin-state enable address 172.16.255.2/32

set / routing-policy policy EXPORT_CONNECTED statement 10 match protocol local
set / routing-policy policy EXPORT_CONNECTED statement 10 action policy-result accept
set / routing-policy policy EXPORT_CONNECTED default-action policy-result accept
set / routing-policy policy RM_PRIMARY_IN default-action policy-result accept bgp local-preference set 200
set / routing-policy policy RM_BACKUP_IN default-action policy-result accept bgp local-preference set 100

set / network-instance default type default admin-state enable
set / network-instance default interface system0.0
set / interface ethernet-1/1 description "WAN-Primary-to-pe-a" admin-state enable
set / interface ethernet-1/1 subinterface 0 admin-state enable ipv4 admin-state enable address 10.101.2.2/30
set / bfd subinterface ethernet-1/1.0 admin-state enable desired-minimum-transmit-interval 100000 required-minimum-receive 100000 detection-multiplier 3
set / network-instance default interface ethernet-1/1.0
set / interface ethernet-1/2 description "WAN-Primary-to-pe-a1" admin-state enable
set / interface ethernet-1/2 subinterface 0 admin-state enable ipv4 admin-state enable address 10.101.4.2/30
set / bfd subinterface ethernet-1/2.0 admin-state enable desired-minimum-transmit-interval 100000 required-minimum-receive 100000 detection-multiplier 3
set / network-instance default interface ethernet-1/2.0
set / interface ethernet-1/3 description "WAN-CrossLink-to-pe-b" admin-state enable
set / interface ethernet-1/3 subinterface 0 admin-state enable ipv4 admin-state enable address 10.101.6.2/30
set / bfd subinterface ethernet-1/3.0 admin-state enable desired-minimum-transmit-interval 100000 required-minimum-receive 100000 detection-multiplier 3
set / network-instance default interface ethernet-1/3.0
set / interface ethernet-1/4 description "WAN-CrossLink-to-pe-b1" admin-state enable
set / interface ethernet-1/4 subinterface 0 admin-state enable ipv4 admin-state enable address 10.101.8.2/30
set / bfd subinterface ethernet-1/4.0 admin-state enable desired-minimum-transmit-interval 100000 required-minimum-receive 100000 detection-multiplier 3
set / network-instance default interface ethernet-1/4.0
set / interface ethernet-1/5 description "Bowtie-802.1Q-Trunk-to-as" admin-state enable vlan-tagging true
set / interface ethernet-1/5 subinterface 10 admin-state enable
set / interface ethernet-1/5 subinterface 10 vlan encap single-tagged vlan-id 10
set / interface ethernet-1/5 subinterface 10 ipv4 admin-state enable address 172.16.10.3/24
set / interface ethernet-1/5 subinterface 10 ipv4 vrrp vrrp-group 10 priority 90 accept-mode true virtual-address [ 172.16.10.1 ]
set / network-instance default interface ethernet-1/5.10
set / interface ethernet-1/5 subinterface 100 admin-state enable
set / interface ethernet-1/5 subinterface 100 vlan encap single-tagged vlan-id 100
set / interface ethernet-1/5 subinterface 100 ipv4 admin-state enable address 192.168.100.3/24
set / interface ethernet-1/5 subinterface 100 ipv4 vrrp vrrp-group 100 priority 90 accept-mode true virtual-address [ 192.168.100.1 ]
set / network-instance default interface ethernet-1/5.100
set / interface ethernet-1/6 description "Bowtie-802.1Q-Trunk-to-as1" admin-state enable vlan-tagging true
set / interface ethernet-1/6 subinterface 11 admin-state enable
set / interface ethernet-1/6 subinterface 11 vlan encap single-tagged vlan-id 11
set / interface ethernet-1/6 subinterface 11 ipv4 admin-state enable address 172.16.11.2/24
set / interface ethernet-1/6 subinterface 11 ipv4 vrrp vrrp-group 11 priority 110 accept-mode true virtual-address [ 172.16.11.1 ]
set / network-instance default interface ethernet-1/6.11
set / interface ethernet-1/6 subinterface 101 admin-state enable
set / interface ethernet-1/6 subinterface 101 vlan encap single-tagged vlan-id 101
set / interface ethernet-1/6 subinterface 101 ipv4 admin-state enable address 192.168.101.2/24
set / interface ethernet-1/6 subinterface 101 ipv4 vrrp vrrp-group 101 priority 110 accept-mode true virtual-address [ 192.168.101.1 ]
set / network-instance default interface ethernet-1/6.101

set / network-instance default protocols bgp admin-state enable autonomous-system 65101 router-id 172.16.255.2
set / network-instance default protocols bgp ebgp-default-policy import-reject-all false export-reject-all false
set / network-instance default protocols bgp afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp afi-safi ipv4-unicast multipath allow-multiple-as true max-paths-level-1 4 max-paths-level-2 4
set / network-instance default protocols bgp group WAN-PRIMARY admin-state enable peer-as 65000
set / network-instance default protocols bgp group WAN-PRIMARY afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group WAN-PRIMARY export-policy [ EXPORT_CONNECTED ]
set / network-instance default protocols bgp group WAN-PRIMARY import-policy [ RM_PRIMARY_IN ]
set / network-instance default protocols bgp group WAN-PRIMARY failure-detection enable-bfd true fast-failover true
set / network-instance default protocols bgp group WAN-BACKUP admin-state enable peer-as 65000
set / network-instance default protocols bgp group WAN-BACKUP afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group WAN-BACKUP export-policy [ EXPORT_CONNECTED ]
set / network-instance default protocols bgp group WAN-BACKUP import-policy [ RM_BACKUP_IN ]
set / network-instance default protocols bgp group WAN-BACKUP failure-detection enable-bfd true fast-failover true
set / network-instance default protocols bgp neighbor 10.101.2.1 peer-group WAN-PRIMARY
set / network-instance default protocols bgp neighbor 10.101.4.1 peer-group WAN-PRIMARY
set / network-instance default protocols bgp neighbor 10.101.6.1 peer-group WAN-BACKUP
set / network-instance default protocols bgp neighbor 10.101.8.1 peer-group WAN-BACKUP