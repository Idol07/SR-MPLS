frr defaults traditional
hostname ce-b1
service integrated-vtysh-config
!
route-map RM_PRI permit 10
 set local-preference 200
route-map RM_BKP permit 10
 set local-preference 100
!
interface lo
 ip address 172.17.255.2/32
!
interface eth1
 ip address 10.102.2.2/30
!
interface eth2
 ip address 10.102.4.2/30
!
interface eth3
 ip address 10.102.6.2/30
!
interface eth4
 ip address 10.102.8.2/30
!
router bgp 65102
 bgp router-id 172.17.255.2
 no bgp ebgp-requires-policy
 neighbor 10.102.2.1 remote-as 65000
 neighbor 10.102.2.1 bfd
 neighbor 10.102.4.1 remote-as 65000
 neighbor 10.102.4.1 bfd
 neighbor 10.102.6.1 remote-as 65000
 neighbor 10.102.6.1 bfd
 neighbor 10.102.8.1 remote-as 65000
 neighbor 10.102.8.1 bfd
 address-family ipv4 unicast
  redistribute connected
  neighbor 10.102.2.1 route-map RM_BKP in
  neighbor 10.102.4.1 route-map RM_BKP in
  neighbor 10.102.6.1 route-map RM_PRI in
  neighbor 10.102.8.1 route-map RM_PRI in
 exit-address-family
!
