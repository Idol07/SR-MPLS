frr defaults traditional
hostname core1
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.11/32
 ip router isis CORE
!
interface eth1
 description Inter-Core-Link-to-core2
 ip address 10.0.12.1/30
 ip router isis CORE
 isis circuit-type level-2-only
 isis metric 10
 isis network point-to-point
 isis bfd
!
interface eth2
 description Core-Link-to-pe-a
 ip address 10.0.1.2/30
 ip router isis CORE
 isis circuit-type level-2-only
 isis metric 10
 isis network point-to-point
 isis bfd
!
interface eth3
 description Core-Link-to-pe-a1
 ip address 10.0.2.2/30
 ip router isis CORE
 isis circuit-type level-2-only
 isis metric 10
 isis network point-to-point
 isis bfd
!
interface eth4
 description Core-Link-to-pe-b
 ip address 10.0.3.2/30
 ip router isis CORE
 isis circuit-type level-2-only
 isis metric 10
 isis network point-to-point
 isis bfd
!
interface eth5
 description Core-Link-to-pe-b1
 ip address 10.0.4.2/30
 ip router isis CORE
 isis circuit-type level-2-only
 isis metric 10
 isis network point-to-point
 isis bfd
!
router isis CORE
 is-type level-2-only
 net 49.0001.0000.0000.0011.00
 segment-routing on
 segment-routing global-block 16000 23999
 segment-routing node-msd 8
 segment-routing prefix 10.0.0.11/32 index 11 explicit-null
!
