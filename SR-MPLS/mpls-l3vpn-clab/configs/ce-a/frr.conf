frr defaults traditional
hostname ce-a
service integrated-vtysh-config
!
route-map RM_PRI permit 10
 set local-preference 200
route-map RM_BKP permit 10
 set local-preference 100
!
interface lo
 ip address 172.16.255.1/32
!
interface eth1
 ip address 10.101.1.2/30
!
interface eth2
 ip address 10.101.3.2/30
!
interface eth3
 ip address 10.101.5.2/30
!
interface eth4
 ip address 10.101.7.2/30
!
router bgp 65101
 bgp router-id 172.16.255.1
 no bgp ebgp-requires-policy
 neighbor 10.101.1.1 remote-as 65000
 neighbor 10.101.1.1 bfd
 neighbor 10.101.3.1 remote-as 65000
 neighbor 10.101.3.1 bfd
 neighbor 10.101.5.1 remote-as 65000
 neighbor 10.101.5.1 bfd
 neighbor 10.101.7.1 remote-as 65000
 neighbor 10.101.7.1 bfd
 address-family ipv4 unicast
  redistribute connected
  neighbor 10.101.1.1 route-map RM_PRI in
  neighbor 10.101.3.1 route-map RM_PRI in
  neighbor 10.101.5.1 route-map RM_BKP in
  neighbor 10.101.7.1 route-map RM_BKP in
 exit-address-family
!
