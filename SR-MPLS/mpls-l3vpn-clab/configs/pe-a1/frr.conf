frr defaults traditional
hostname pe-a1
service integrated-vtysh-config
!
vrf vrf-a
 exit-vrf
vrf vrf-b
 exit-vrf
!
ip prefix-list PL_OVERLAP deny 192.168.0.0/16 le 32
ip prefix-list PL_OVERLAP permit 0.0.0.0/0 le 32
route-map RM_EXTRANET permit 10
 match ip address prefix-list PL_OVERLAP
!
interface lo
 ip address 10.0.0.2/32
 ip router isis CORE
!
interface eth1
 ip address 10.0.2.1/30
 ip router isis CORE
 isis circuit-type level-2-only
 isis metric 10
 isis network point-to-point
 isis bfd
!
interface eth2
 ip address 10.0.6.1/30
 ip router isis CORE
 isis circuit-type level-2-only
 isis metric 10
 isis network point-to-point
 isis bfd
!
interface eth3 vrf vrf-a
 ip address 10.101.3.1/30
!
interface eth4 vrf vrf-a
 ip address 10.101.4.1/30
!
interface eth5 vrf vrf-b
 ip address 10.102.3.1/30
!
interface eth6 vrf vrf-b
 ip address 10.102.4.1/30
!
router isis CORE
 is-type level-2-only
 net 49.0001.0000.0000.0002.00
 segment-routing on
 segment-routing global-block 16000 23999
 segment-routing node-msd 8
 segment-routing prefix 10.0.0.2/32 index 2 explicit-null
!
router bgp 65000
 bgp router-id 10.0.0.2
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 10.0.0.1 remote-as 65000
 neighbor 10.0.0.1 update-source lo
 neighbor 10.0.0.1 bfd
 neighbor 10.0.0.3 remote-as 65000
 neighbor 10.0.0.3 update-source lo
 neighbor 10.0.0.3 bfd
 neighbor 10.0.0.4 remote-as 65000
 neighbor 10.0.0.4 update-source lo
 neighbor 10.0.0.4 bfd
 address-family ipv4 vpn
  neighbor 10.0.0.1 activate
  neighbor 10.0.0.1 send-community both
  neighbor 10.0.0.3 activate
  neighbor 10.0.0.3 send-community both
  neighbor 10.0.0.4 activate
  neighbor 10.0.0.4 send-community both
 exit-address-family
!
router bgp 65000 vrf vrf-a
 no bgp ebgp-requires-policy
 neighbor 10.101.3.2 remote-as 65101
 neighbor 10.101.3.2 bfd
 neighbor 10.101.4.2 remote-as 65101
 neighbor 10.101.4.2 bfd
 address-family ipv4 unicast
  neighbor 10.101.3.2 activate
  neighbor 10.101.4.2 activate
  rd vpn export 10.0.0.2:101
  rt vpn export 65000:101
  rt vpn import 65000:101 65000:102
  route-map vpn import RM_EXTRANET
  label vpn export auto
  export vpn
  import vpn
 exit-address-family
!
router bgp 65000 vrf vrf-b
 no bgp ebgp-requires-policy
 neighbor 10.102.3.2 remote-as 65102
 neighbor 10.102.3.2 bfd
 neighbor 10.102.4.2 remote-as 65102
 neighbor 10.102.4.2 bfd
 address-family ipv4 unicast
  neighbor 10.102.3.2 activate
  neighbor 10.102.4.2 activate
  rd vpn export 10.0.0.2:102
  rt vpn export 65000:102
  rt vpn import 65000:102 65000:101
  route-map vpn import RM_EXTRANET
  label vpn export auto
  export vpn
  import vpn
 exit-address-family
!
