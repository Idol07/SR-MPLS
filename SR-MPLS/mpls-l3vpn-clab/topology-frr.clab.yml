name: mpls-l3vpn-extranet
prefix: clab

# =============================================================================
# Lightweight 100% FRRouting + Linux Bridge Profile (Matching User Template)
# =============================================================================

mgmt:
  network: clab-mpls-mgmt
  ipv4-subnet: 172.20.20.0/24

topology:
  kinds:
    linux:
      image: quay.io/frrouting/frr:10.0.1

  nodes:
    core1:
      kind: linux
      mgmt-ipv4: 172.20.20.11
      binds:
        - configs/daemons-core:/etc/frr/daemons
        - configs/core1/frr.conf:/etc/frr/frr.conf
        - scripts/nodes/core1-setup.sh:/setup.sh:ro
      exec:
        - sh /setup.sh
    core2:
      kind: linux
      mgmt-ipv4: 172.20.20.12
      binds:
        - configs/daemons-core:/etc/frr/daemons
        - configs/core2/frr.conf:/etc/frr/frr.conf
        - scripts/nodes/core2-setup.sh:/setup.sh:ro
      exec:
        - sh /setup.sh

    pe-a:
      kind: linux
      mgmt-ipv4: 172.20.20.21
      binds:
        - configs/daemons-pe:/etc/frr/daemons
        - configs/pe-a/frr.conf:/etc/frr/frr.conf
        - scripts/nodes/pe-a-setup.sh:/setup.sh:ro
      exec:
        - sh /setup.sh
    pe-a1:
      kind: linux
      mgmt-ipv4: 172.20.20.22
      binds:
        - configs/daemons-pe:/etc/frr/daemons
        - configs/pe-a1/frr.conf:/etc/frr/frr.conf
        - scripts/nodes/pe-a1-setup.sh:/setup.sh:ro
      exec:
        - sh /setup.sh
    pe-b:
      kind: linux
      mgmt-ipv4: 172.20.20.23
      binds:
        - configs/daemons-pe:/etc/frr/daemons
        - configs/pe-b/frr.conf:/etc/frr/frr.conf
        - scripts/nodes/pe-b-setup.sh:/setup.sh:ro
      exec:
        - sh /setup.sh
    pe-b1:
      kind: linux
      mgmt-ipv4: 172.20.20.24
      binds:
        - configs/daemons-pe:/etc/frr/daemons
        - configs/pe-b1/frr.conf:/etc/frr/frr.conf
        - scripts/nodes/pe-b1-setup.sh:/setup.sh:ro
      exec:
        - sh /setup.sh

    ce-a:
      kind: linux
      mgmt-ipv4: 172.20.20.31
      binds:
        - configs/daemons-ce:/etc/frr/daemons
        - configs/ce-a/frr.conf:/etc/frr/frr.conf
        - scripts/nodes/ce-a-setup.sh:/setup.sh:ro
      exec:
        - sh /setup.sh
    ce-a1:
      kind: linux
      mgmt-ipv4: 172.20.20.32
      binds:
        - configs/daemons-ce:/etc/frr/daemons
        - configs/ce-a1/frr.conf:/etc/frr/frr.conf
        - scripts/nodes/ce-a1-setup.sh:/setup.sh:ro
      exec:
        - sh /setup.sh
    ce-b:
      kind: linux
      mgmt-ipv4: 172.20.20.33
      binds:
        - configs/daemons-ce:/etc/frr/daemons
        - configs/ce-b/frr.conf:/etc/frr/frr.conf
        - scripts/nodes/ce-b-setup.sh:/setup.sh:ro
      exec:
        - sh /setup.sh
    ce-b1:
      kind: linux
      mgmt-ipv4: 172.20.20.34
      binds:
        - configs/daemons-ce:/etc/frr/daemons
        - configs/ce-b1/frr.conf:/etc/frr/frr.conf
        - scripts/nodes/ce-b1-setup.sh:/setup.sh:ro
      exec:
        - sh /setup.sh

    as:
      kind: linux
      mgmt-ipv4: 172.20.20.41
      binds:
        - scripts/nodes/as-setup.sh:/setup.sh:ro
      exec:
        - sh /setup.sh
    as1:
      kind: linux
      mgmt-ipv4: 172.20.20.42
      binds:
        - scripts/nodes/as1-setup.sh:/setup.sh:ro
      exec:
        - sh /setup.sh
    bs:
      kind: linux
      mgmt-ipv4: 172.20.20.43
      binds:
        - scripts/nodes/bs-setup.sh:/setup.sh:ro
      exec:
        - sh /setup.sh
    bs1:
      kind: linux
      mgmt-ipv4: 172.20.20.44
      binds:
        - scripts/nodes/bs1-setup.sh:/setup.sh:ro
      exec:
        - sh /setup.sh

    host-as:
      kind: linux
      mgmt-ipv4: 172.20.20.51
      binds:
        - scripts/nodes/host-as-setup.sh:/setup.sh:ro
      exec:
        - sh /setup.sh
    host-as1:
      kind: linux
      mgmt-ipv4: 172.20.20.52
      binds:
        - scripts/nodes/host-as1-setup.sh:/setup.sh:ro
      exec:
        - sh /setup.sh
    host-bs:
      kind: linux
      mgmt-ipv4: 172.20.20.53
      binds:
        - scripts/nodes/host-bs-setup.sh:/setup.sh:ro
      exec:
        - sh /setup.sh
    host-bs1:
      kind: linux
      mgmt-ipv4: 172.20.20.54
      binds:
        - scripts/nodes/host-bs1-setup.sh:/setup.sh:ro
      exec:
        - sh /setup.sh

  links:
    - endpoints: ["core1:eth1", "core2:eth1"]
    - endpoints: ["core1:eth2", "pe-a:eth1"]
    - endpoints: ["core1:eth3", "pe-a1:eth1"]
    - endpoints: ["core1:eth4", "pe-b:eth1"]
    - endpoints: ["core1:eth5", "pe-b1:eth1"]
    - endpoints: ["core2:eth2", "pe-a:eth2"]
    - endpoints: ["core2:eth3", "pe-a1:eth2"]
    - endpoints: ["core2:eth4", "pe-b:eth2"]
    - endpoints: ["core2:eth5", "pe-b1:eth2"]

    - endpoints: ["pe-a:eth3", "ce-a:eth1"]
    - endpoints: ["pe-a:eth4", "ce-a1:eth1"]
    - endpoints: ["pe-a:eth5", "ce-b:eth1"]
    - endpoints: ["pe-a:eth6", "ce-b1:eth1"]

    - endpoints: ["pe-a1:eth3", "ce-a:eth2"]
    - endpoints: ["pe-a1:eth4", "ce-a1:eth2"]
    - endpoints: ["pe-a1:eth5", "ce-b:eth2"]
    - endpoints: ["pe-a1:eth6", "ce-b1:eth2"]

    - endpoints: ["pe-b:eth3", "ce-a:eth3"]
    - endpoints: ["pe-b:eth4", "ce-a1:eth3"]
    - endpoints: ["pe-b:eth5", "ce-b:eth3"]
    - endpoints: ["pe-b:eth6", "ce-b1:eth3"]

    - endpoints: ["pe-b1:eth3", "ce-a:eth4"]
    - endpoints: ["pe-b1:eth4", "ce-a1:eth4"]
    - endpoints: ["pe-b1:eth5", "ce-b:eth4"]
    - endpoints: ["pe-b1:eth6", "ce-b1:eth4"]

    - endpoints: ["ce-a:eth5", "as:eth1"]
    - endpoints: ["ce-a:eth6", "as1:eth1"]
    - endpoints: ["ce-a1:eth5", "as:eth2"]
    - endpoints: ["ce-a1:eth6", "as1:eth2"]

    - endpoints: ["ce-b:eth5", "bs:eth1"]
    - endpoints: ["ce-b:eth6", "bs1:eth1"]
    - endpoints: ["ce-b1:eth5", "bs:eth2"]
    - endpoints: ["ce-b1:eth6", "bs1:eth2"]

    - endpoints: ["as:eth3", "host-as:eth1"]
    - endpoints: ["as1:eth4", "host-as:eth2"]
    - endpoints: ["as:eth5", "host-as:eth3"]

    - endpoints: ["as1:eth3", "host-as1:eth1"]
    - endpoints: ["as:eth4", "host-as1:eth2"]
    - endpoints: ["as1:eth5", "host-as1:eth3"]

    - endpoints: ["bs:eth3", "host-bs:eth1"]
    - endpoints: ["bs1:eth4", "host-bs:eth2"]
    - endpoints: ["bs:eth5", "host-bs:eth3"]

    - endpoints: ["bs1:eth3", "host-bs1:eth1"]
    - endpoints: ["bs:eth4", "host-bs1:eth2"]
    - endpoints: ["bs1:eth5", "host-bs1:eth3"]
